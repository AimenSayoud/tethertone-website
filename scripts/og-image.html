<!doctype html>
<!-- Template for src/assets/img/og-image.png (1200×630). Render with: npm run og -->
<html lang="en"><head><meta charset="utf-8"><title>AudioBridge social image</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    background: #070b16; color: #e8eef7; position: relative; padding: 76px 84px;
  }
  body::before { content: ""; position: absolute; inset: 0;
    background: radial-gradient(55% 75% at 88% 20%, rgba(56,189,248,.34), transparent 70%),
                radial-gradient(40% 50% at 0% 100%, rgba(14,165,233,.18), transparent 70%); }
  body::after { content: ""; position: absolute; inset: 0; opacity: .35;
    background-image: linear-gradient(#1e293b 1px, transparent 1px), linear-gradient(90deg, #1e293b 1px, transparent 1px);
    background-size: 60px 60px;
    -webkit-mask-image: radial-gradient(70% 80% at 70% 40%, #000 10%, transparent 75%); }
  .wrap { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 34px; font-weight: 750; letter-spacing: -.02em; }
  .brand svg { width: 64px; height: 64px; border-radius: 15px; box-shadow: 0 0 0 1px rgba(125,211,252,.25), 0 10px 30px rgba(56,189,248,.25); }
  h1 { margin-top: 54px; font-size: 76px; line-height: 1.02; letter-spacing: -.045em; font-weight: 780; max-width: 820px; }
  h1 span { background: linear-gradient(135deg, #0ea5e9, #38bdf8 45%, #bae6fd); -webkit-background-clip: text; color: transparent; }
  .sub { margin-top: 26px; font-size: 29px; color: #a5b1c4; letter-spacing: -.01em; }
  .chips { margin-top: auto; display: flex; gap: 14px; }
  .chips span { padding: 11px 20px; border-radius: 999px; border: 1px solid #334155; background: rgba(15,23,42,.8); font-size: 22px; font-weight: 600; color: #cbd5e1; }
  .bars { position: absolute; z-index: 1; right: 84px; bottom: 96px; display: flex; align-items: flex-end; gap: 12px; height: 260px; }
  .bars i { width: 26px; border-radius: 10px; background: linear-gradient(to top, #0ea5e9, #7dd3fc); }
</style></head>
<body><div class="wrap">
  <div class="brand"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7.5" fill="#0b1120"/><rect x="7.5" y="19.8" width="2.4" height="3.9" rx="1" fill="#bae6fd"/><rect x="11.4" y="16" width="2.4" height="7.7" rx="1" fill="#7dd3fc"/><rect x="15.2" y="10.9" width="2.4" height="12.8" rx="1" fill="#38bdf8"/><rect x="19" y="14.1" width="2.4" height="9.6" rx="1" fill="#0ea5e9"/><rect x="22.9" y="19.8" width="2.4" height="3.9" rx="1" fill="#bae6fd"/></svg>AudioBridge</div>
  <h1>Your Mac's audio,<br><span>on your Android phone.</span></h1>
  <p class="sub">Over USB or Wi-Fi · lossless · low latency · one QR scan</p>
  <div class="chips"><span>Free &amp; open source</span><span>macOS 14+</span><span>Android 8+</span></div>
</div>
<div class="bars" aria-hidden="true"><i style="height:30%"></i><i style="height:55%"></i><i style="height:85%"></i><i style="height:100%"></i><i style="height:70%"></i><i style="height:45%"></i><i style="height:25%"></i></div>
</body></html>
